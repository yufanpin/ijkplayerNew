name: android-ijkplayer-aar

on:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: publish beta edition
        default: true
        required: false

# needed by `gh release create` at the end of the job
permissions:
  contents: write

jobs:
  build:
    name: build-android-ijk-aar
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          submodules: recursive
    - name: Prepare Beta Version
      if: ${{ inputs.beta == true }}
      run: |
        grep -m 1 VERSION_NAME= version.sh | awk -F = '{printf "VERSION=%s",$2}' | xargs > constants.env
        echo "RELEAE_DATE=$(TZ=UTC-8 date +'%y%m%d%H%M%S')" >> constants.env
        echo "TAG=k"$(grep "VERSION" constants.env | cut -d'=' -f2)"-beta-"$(grep "RELEAE_DATE" constants.env | cut -d'=' -f2) >> constants.env
        cat constants.env
    - name: Prepare Normal Version
      if: ${{ inputs.beta == false }}
      run: |
        grep -m 1 VERSION_NAME= version.sh | awk -F = '{printf "TAG=k%s",$2}' | xargs > constants.env
        cat constants.env
    - name: Export Env
      uses: cardinalby/export-env-action@v2
      with:
        envFile: 'constants.env'
    - name: Setup Android NDK env
      run: |
        NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-${ANDROID_NDK_LATEST_HOME:-}}}}"
        if [ -z "$NDK" ] && [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
          NDK="$ANDROID_HOME/ndk/$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
        fi
        echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
        echo "Resolved NDK: $NDK"
        [ -n "$NDK" ] || { echo "!! No Android NDK found"; exit 1; }
    - name: Build ffmpeg from source with avfilter
      run: cd android && bash build-ffmpeg-with-avfilter.sh
    - name: Build android aar
      run: cd android && ./build-aar.sh
    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ijkplayer-cmake-aar
        path: android/ijkplayer/ijkplayer-cmake/build/outputs/aar/*.aar
        if-no-files-found: error
    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        branch=$(git branch --show-current)
        gh release create ${{ env.TAG }} --target $branch -t "ijkplayer-cmake-aar ${{ env.TAG }}" android/ijkplayer/ijkplayer-cmake/build/outputs/aar/*.*
